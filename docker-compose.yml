services:
  orchestrator:
    build: .
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    env_file: .env
    volumes:
      - ./data:/data
      - ./config:/app/config:ro
      - ./prompts:/app/prompts:ro
      - ${HOME}/.ssh:/home/node/.ssh:ro
