display_information:
  name: Slackteam
features:
  bot_user:
    display_name: Slackteam
    always_online: true
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - channels:history
      - channels:join
      - channels:manage
      - channels:read
      - chat:write
      - chat:write.customize
      - groups:history
      - groups:read
      - groups:write
      - im:history
      - im:read
      - im:write
      - pins:read
      - pins:write
      - reactions:read
      - reactions:write
      - users:read
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.channels
      - message.groups
      - message.im
  interactivity:
    is_enabled: true
  socket_mode_enabled: true
